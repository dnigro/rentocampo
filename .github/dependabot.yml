version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Argentina/Buenos_Aires"
    open-pull-requests-limit: 2
    groups:
      compatible-updates:
        update-types:
          - "minor"
          - "patch"
