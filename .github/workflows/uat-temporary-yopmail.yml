name: UAT Alta Yopmail puntual

on:
  workflow_dispatch:
  push:
    branches: [feat/regional-ar-uy-py-20261014]
    paths: [.github/workflows/uat-temporary-yopmail.yml]

permissions:
  contents: read

jobs:
  registro:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://wibqszhvuvpjycheaxzi.supabase.co
      UAT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.UAT_SUPABASE_PUBLISHABLE_KEY }}
      UAT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY }}
      UAT_TEST_EMAIL: bucenti1234@yopmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify isolated credentials
        run: |
          test -n "$UAT_SUPABASE_PUBLISHABLE_KEY"
          test -n "$UAT_SUPABASE_SERVICE_ROLE_KEY"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://wibqszhvuvpjycheaxzi.supabase.co"
      - name: Install existing locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Register one real UAT email account
        run: node tests/uat-temporary-yopmail.mjs
