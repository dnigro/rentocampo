name: UAT Correo Yopmail

on:
  workflow_dispatch:
  push:
    branches: [feat/regional-ar-uy-py-20261014]
    paths: [.github/workflows/uat-yopmail-probe.yml]

permissions:
  contents: read

jobs:
  prueba-email-real:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://wibqszhvuvpjycheaxzi.supabase.co
      UAT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.UAT_SUPABASE_PUBLISHABLE_KEY }}
      UAT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY }}
      UAT_PROBE_EMAIL: alt.xi-4of7xjna@yopmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify UAT-only secrets are present
        run: |
          test -n "$UAT_SUPABASE_PUBLISHABLE_KEY" && test -n "$UAT_SUPABASE_SERVICE_ROLE_KEY"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://wibqszhvuvpjycheaxzi.supabase.co"
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Attempt one actual UAT email registration
        run: node tests/uat-real-email-probe.mjs
