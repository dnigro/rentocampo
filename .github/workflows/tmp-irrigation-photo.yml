name: Temporary irrigation hero asset
on:
  push:
    branches: [feat/hero-regional-conversion-v1-20261015]
    paths:
      - .github/workflows/tmp-irrigation-photo.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare black-and-white irrigation hero photograph
        run: |
          curl --fail --location --retry 2 --max-time 45 --user-agent 'Mozilla/5.0' \
            'https://cdn.pixabay.com/photo/2019/09/04/21/08/irrigation-4452582_1280.jpg' -o /tmp/irrigacion.jpg
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          from pathlib import Path
          im=Image.open('/tmp/irrigacion.jpg').convert('RGB')
          if min(im.size)<600: raise RuntimeError(f'Wrong image resolution: {im.size}')
          # Landscape pivot original starts on the left; place it on the right
          # and retain open dark sky behind the editable website copy.
          im=ImageOps.mirror(im)
          im=ImageOps.fit(im,(1600,900),method=Image.Resampling.LANCZOS,centering=(.5,.5))
          im=ImageOps.grayscale(im)
          im=ImageEnhance.Contrast(im).enhance(.88)
          im=ImageEnhance.Brightness(im).enhance(.68)
          path=Path('public/hero-regional-riego-bn.webp')
          im.save(path,format='WEBP',quality=80,method=6)
          print(f'IRRIGATION_IMAGE_OK {path} {path.stat().st_size} bytes')
          PY
      - name: Commit only the asset to preview branch
        run: |
          test "$GITHUB_REF_NAME" = "feat/hero-regional-conversion-v1-20261015"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hero-regional-riego-bn.webp
          git commit -m 'assets(hero): add matte B&W irrigation farm photograph'
          git push origin "HEAD:$GITHUB_REF_NAME"
