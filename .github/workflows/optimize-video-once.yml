name: Optimize deployment assets once

on:
  push:
    branches: [chore/vercel-deployment-hardening]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Optimize landing video
        run: |
          ffmpeg -hide_banner -loglevel error \
            -i public/RentoCampo_video_real_dron_tractor_silos_mar_16x9.mp4.mp4 \
            -vf 'scale=1280:-2' -c:v libx264 -preset medium -crf 29 \
            -movflags +faststart -an /tmp/rentocampo-optimized.mp4
          mv /tmp/rentocampo-optimized.mp4 \
            public/RentoCampo_video_real_dron_tractor_silos_mar_16x9.mp4.mp4

      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/optimize-video-once.yml
          git add package-lock.json public/RentoCampo_video_real_dron_tractor_silos_mar_16x9.mp4.mp4
          git commit -m 'Optimize deployment artifacts'
          git push
