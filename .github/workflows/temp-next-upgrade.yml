# Only runs on the dedicated internal security patch branch.
name: Temporary trusted Next.js lockfile upgrade

on:
  push:
    branches: [security/next-16-4-5-20261107]

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'dnigro/rentocampo' && github.event.head_commit.message != 'ci(security): lock next 16.4.5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve patched stable Next.js without lifecycle scripts
        run: npm install next@16.4.5 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show production dependency exposure
        run: |
          npm audit --omit=dev --json > /tmp/audit-next.json || true
          node -e 'const a=require("/tmp/audit-next.json"); if(a.error) { console.error(a.error); process.exit(1); } console.log(a.metadata?.vulnerabilities); console.log(Object.keys(a.vulnerabilities||{}))'
      - name: Commit only manifest and lockfile to dedicated branch
        run: |
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency lockfile changes"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'ci(security): lock next 16.4.5'
            git push origin HEAD:security/next-16-4-5-20261107
          fi
