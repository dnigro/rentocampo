name: One-time security lockfile patch

on:
  push:
    branches: [security/next-hotfix-20261108]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'dnigro/rentocampo' && github.ref == 'refs/heads/security/next-hotfix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild lockfile for reviewed Next.js patch
        run: npm install next@16.4.5 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm Next.js version and lockfile
        run: |
          node -e 'const p=require("./package.json"), l=require("./package-lock.json"); if(p.dependencies.next !== "16.4.5" || l.packages["node_modules/next"].version !== "16.4.5") process.exit(1)'
      - name: Commit only verified dependency manifests
        run: |
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(security): refresh Next 16.4.5 lockfile'
            git push origin HEAD:security/next-hotfix-20261108
          fi
