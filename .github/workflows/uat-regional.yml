name: UAT Registro Multiformato

on:
  workflow_dispatch:
  push:
    branches: [feat/regional-ar-uy-py-20261014, feat/regional-six-countries-20261015, feat/brasil-foundation-20261019]

concurrency:
  group: uat-registro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registro-browser-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Local Next runtime, never production or the protected Vercel preview.
      NEXT_PUBLIC_SUPABASE_URL: https://wibqszhvuvpjycheaxzi.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.UAT_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY }}
      UAT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.UAT_SUPABASE_PUBLISHABLE_KEY }}
      UAT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.UAT_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      UAT_SMTP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Enforce UAT-only credentials
        shell: bash
        run: |
          test -n "$UAT_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::UAT publishable key missing"; exit 1; }
          test -n "$UAT_SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::UAT private key missing"; exit 1; }
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://wibqszhvuvpjycheaxzi.supabase.co" || exit 1
          test -z "$VERCEL_ENV" || { echo "::error::Cloud deployment forbidden"; exit 1; }
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright in a separate temporary npm project
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/rc-uat-playwright"
          npm install --prefix "$RUNNER_TEMP/rc-uat-playwright" --no-save --no-audit --no-fund playwright@1.55.0
          ln -s "$RUNNER_TEMP/rc-uat-playwright/node_modules/playwright" ./node_modules/playwright
      - name: Install Chromium, Firefox and WebKit
        run: node "$RUNNER_TEMP/rc-uat-playwright/node_modules/playwright/cli.js" install --with-deps chromium firefox webkit
      - name: Build local UAT application
        run: npm run build
      - name: Real browser signup and responsive tests
        run: node tests/uat-browser.mjs
      - name: Upload UAT evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-registro-multiformato
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
