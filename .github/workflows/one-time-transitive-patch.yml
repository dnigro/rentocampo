name: Temporary transitive security lockfile patch

on:
  push:
    branches: [security/transitive-hotfix-20261108]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.repository == 'dnigro/rentocampo' && github.ref == 'refs/heads/security/transitive-hotfix-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recalculate lockfile without dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency versions
        run: |
          node - <<'NODE'
          const p=require("./package.json"), l=require("./package-lock.json");
          for (const [name,version] of Object.entries(p.overrides)) {
            if (l.packages["node_modules/"+name]?.version !== version) {
              console.error("Unpatched dependency",name,l.packages["node_modules/"+name]?.version);
              process.exit(1);
            }
          }
          console.log("Transitive security patches pinned");
          NODE
      - name: Commit only manifest and lockfile to dedicated security branch
        run: |
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(security): refresh patched transitive lockfile'
            git push origin HEAD:security/transitive-hotfix-20261108
          fi
