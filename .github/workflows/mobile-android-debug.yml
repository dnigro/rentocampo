name: Mobile Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [feat/mobile-app-foundation]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-android-debug.yml'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo dependencies
        run: npx expo install --fix --non-interactive
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rentocampo-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
