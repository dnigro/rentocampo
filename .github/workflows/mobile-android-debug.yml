name: Mobile Android standalone APK
on:
  workflow_dispatch:
  push:
    branches: [feat/mobile-app-foundation]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-android-debug.yml'
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Align Expo dependencies
        run: CI=1 npx expo install --fix
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone release APK with bundled JavaScript
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify standalone APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc|assets/.*bundle' || { echo 'Missing embedded JS bundle'; exit 1; }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rentocampo-android-standalone
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
